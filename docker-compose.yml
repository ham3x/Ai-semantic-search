services:
  # 1. ChromaDB Vector Database service
  chroma:
    image: chromadb/chroma:latest
    platform: linux/amd64
    container_name: semantic-chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    restart: always

  # 2. LiteLLM Proxy AI Gateway service
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    platform: linux/amd64
    container_name: litellm-proxy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - DISABLE_TELEMETRY=TRUE
    restart: always

  # 3. The Python Backend service
  backend:
    build: .
    platform: linux/amd64
    container_name: semantic-backend
    ports:
      - "${BACKEND_PORT:-5001}:5002"
    environment:
      - CHROMA_MODE=${CHROMA_MODE:-http}
      - CHROMA_HOST=${CHROMA_HOST:-chroma}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://litellm-proxy:4000/v1}
      - LITELLM_API_URL=${LITELLM_API_URL:-http://litellm-proxy:4000/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-bge-large}
      - LLM_MODEL=${LLM_MODEL:-llama-3-8b}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-myuser}:${MYSQL_PASSWORD:-mypassword}@mysql-db:3306/${MYSQL_DATABASE:-mydb}}
    depends_on:
      - chroma
      - mysql-db
      - litellm-proxy
    restart: always

  # 4. The React Frontend service
  frontend:
    build: ./frontend
    platform: linux/amd64
    container_name: semantic-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:5002}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    restart: always

  # 5. The MySQL Database Service
  mysql-db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: database-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-myrootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mydb}
      - MYSQL_USER=${MYSQL_USER:-myuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mypassword}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

volumes:
  chroma-data:
  mysql-data: